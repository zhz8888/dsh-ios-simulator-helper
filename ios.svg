<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>iOS Simulator helper</title>
  <!--
    The iOS wordmark, fitted to the 36x36 frame DSH uses for plugin icons.

    `dsh-app-boot` admits this file as plugin metadata and serves its raw bytes
    as an exported resource, so the icon is rendered as an image, never inlined:
    it cannot inherit `currentColor` and has to carry its own adaptivity.

    The ink keeps the glyph's original colour (#2c2c2c) for the light theme and
    flips to its exact inverse (#d3d3d3) under `prefers-color-scheme: dark`.
    Declaring `color-scheme: light dark` on the root is what makes the file a
    colour-scheme aware image: a supporting engine then resolves the media query
    from the *embedding* element's colour scheme, so the icon follows the DSH
    theme rather than only the operating system. Engines that do not implement
    that fall back to the system preference, which is the same behaviour as the
    rest of the app's own `prefers-color-scheme` styles.

    The ink also sits in a nested viewport inset by 4px, so the wordmark is
    optically centred with even margins instead of touching the frame edges.
  -->
  <style>
    :root {
      color-scheme: light dark;
    }
    .ismh-ink {
      fill: #2c2c2c;
    }
    @media (prefers-color-scheme: dark) {
      .ismh-ink {
        fill: #d3d3d3;
      }
    }
  </style>
  <!-- viewBox is the wordmark's own ink box, so the nested viewport fits it
       automatically and stays correct if the path is ever re-tightened. -->
  <svg x="4" y="4" width="28" height="28" viewBox="0 258 1028 508" preserveAspectRatio="xMidYMid meet">
